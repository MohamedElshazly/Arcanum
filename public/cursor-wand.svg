<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Outer glow halo around the orb -->
  <circle cx="6" cy="6" r="6" fill="#aa66ff" opacity="0.25"/>
  <circle cx="6" cy="6" r="4" fill="#c896ff" opacity="0.45"/>
  <!-- Bright core of the orb -->
  <circle cx="6" cy="6" r="2.2" fill="#f3e8ff"/>
  <!-- Wand stick — from orb base to lower-right -->
  <line x1="8" y1="8" x2="28" y2="28" stroke="#3a1c5e" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="8.5" y1="8.5" x2="27.5" y2="27.5" stroke="#7a52aa" stroke-width="1" stroke-linecap="round"/>
  <!-- Magical wrap accent near the handle end -->
  <line x1="22" y1="22" x2="28" y2="28" stroke="#a070ff" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Tiny spark dot at the handle tip -->
  <circle cx="28" cy="28" r="1.5" fill="#ffd28e" opacity="0.85"/>
</svg>
