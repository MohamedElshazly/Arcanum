<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcanum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="game-canvas"></div>

    <div id="hud">
      <div id="hud-topleft">
        <div class="stat-bar-wrap">
          <span class="bar-label">HP</span>
          <div class="bar-track">
            <div id="hp-fill" class="bar-fill hp"></div>
          </div>
        </div>
        <div class="stat-bar-wrap">
          <span class="bar-label">MP</span>
          <div class="bar-track">
            <div id="mana-fill" class="bar-fill mana"></div>
          </div>
        </div>
      </div>

      <div id="spell-bars">
        <div class="spell-bar" id="bar-1">
          <div class="spell-slot" id="bar1-slot-0">
            <div class="slot-cooldown" id="bar1-cd-0"></div>
            <div class="slot-key">Q</div>
            <div class="slot-name" id="bar1-name-0"></div>
            <div class="slot-cost" id="bar1-cost-0"></div>
          </div>
          <div class="spell-slot" id="bar1-slot-1">
            <div class="slot-cooldown" id="bar1-cd-1"></div>
            <div class="slot-key">E</div>
            <div class="slot-name" id="bar1-name-1"></div>
            <div class="slot-cost" id="bar1-cost-1"></div>
          </div>
          <div class="spell-slot" id="bar1-slot-2">
            <div class="slot-cooldown" id="bar1-cd-2"></div>
            <div class="slot-key">R</div>
            <div class="slot-name" id="bar1-name-2"></div>
            <div class="slot-cost" id="bar1-cost-2"></div>
          </div>
          <div class="spell-slot" id="bar1-slot-3">
            <div class="slot-cooldown" id="bar1-cd-3"></div>
            <div class="slot-key">F</div>
            <div class="slot-name" id="bar1-name-3"></div>
            <div class="slot-cost" id="bar1-cost-3"></div>
          </div>
        </div>

        <div id="bar-indicator">BAR 1<br><span class="tab-hint">TAB</span></div>

        <div class="spell-bar inactive" id="bar-2">
          <div class="spell-slot" id="bar2-slot-0">
            <div class="slot-cooldown" id="bar2-cd-0"></div>
            <div class="slot-key">Q</div>
            <div class="slot-name" id="bar2-name-0"></div>
            <div class="slot-cost" id="bar2-cost-0"></div>
          </div>
          <div class="spell-slot" id="bar2-slot-1">
            <div class="slot-cooldown" id="bar2-cd-1"></div>
            <div class="slot-key">E</div>
            <div class="slot-name" id="bar2-name-1"></div>
            <div class="slot-cost" id="bar2-cost-1"></div>
          </div>
          <div class="spell-slot" id="bar2-slot-2">
            <div class="slot-cooldown" id="bar2-cd-2"></div>
            <div class="slot-key">R</div>
            <div class="slot-name" id="bar2-name-2"></div>
            <div class="slot-cost" id="bar2-cost-2"></div>
          </div>
          <div class="spell-slot" id="bar2-slot-3">
            <div class="slot-cooldown" id="bar2-cd-3"></div>
            <div class="slot-key">F</div>
            <div class="slot-name" id="bar2-name-3"></div>
            <div class="slot-cost" id="bar2-cost-3"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="boss-hp-bar" style="display:none">
      <div id="boss-name">VOID LICH</div>
      <div id="boss-phase">Phase I</div>
      <div id="boss-hp-track"><div id="boss-hp-fill"></div></div>
    </div>

    <div id="fade-overlay"></div>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="biome-desc"></div>

    <!-- Phase 4 UI containers -->
    <div id="loadout-root"></div>
    <div id="evolution-overlay-root"></div>
    <div id="run-summary-root"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
